<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Broadcast Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bg-start: #1f2937;
    --bg-end: #111827;
    --card-bg: rgba(31, 41, 55, 0.6);
    --card-border: rgba(255, 255, 255, 0.1);
    --primary: #2563eb;
    --danger: #dc2626;
    --text: #ffffff;
    --text-muted: #9ca3af;
    --radius: 18px;
}

* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: 'Inter', sans-serif; 
}

body {
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
}

.glass-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    margin-bottom: 20px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

h1.title {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
    font-weight: 600;
}

textarea, .custom-input {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    color: var(--text);
    font-size: 15px;
    transition: all 0.3s ease;
    margin-bottom: 16px;
}

textarea {
    resize: none;
    min-height: 140px;
}

textarea:focus, .custom-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
}

.media-selectors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
}

.upload-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px dashed var(--card-border);
    border-radius: 16px;
    padding: 24px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
}

.upload-card:hover {
    background: rgba(37, 99, 235, 0.1);
    border-color: var(--primary);
    transform: scale(1.02);
}

.upload-card i {
    font-size: 32px;
    margin-bottom: 12px;
    display: block;
    color: var(--primary);
}

.upload-card span {
    font-size: 14px;
    font-weight: 600;
    display: block;
}

.upload-card .selection-status {
    font-size: 12px;
    color: #10b981;
    margin-top: 8px;
    display: none;
    font-weight: 700;
}

.btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
}

.btn:hover {
    transform: scale(1.02);
}

.btn:active {
    transform: scale(0.98);
}

.btn-primary { 
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); 
}

.btn-danger-outline {
    background: transparent;
    border: 2px solid var(--danger);
    color: var(--danger);
    margin-top: 12px;
}

.btn-danger-outline:hover {
    background: rgba(220, 38, 38, 0.1);
}

.counter-card {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
    margin: 20px 0;
}

.spinner {
    width: 30px;
    height: 30px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* PREVIEW MODAL STYLES */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(5px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-content {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    animation: modalSlideIn 0.3s ease;
}

@keyframes modalSlideIn {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.preview-box {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
}

.preview-media {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 12px;
    padding-bottom: 8px;
}

.preview-thumb {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    background: #000;
}

.preview-text {
    font-size: 15px;
    white-space: pre-wrap;
    margin-bottom: 12px;
}

.preview-caption {
    font-size: 14px;
    color: var(--text-muted);
    font-style: italic;
    border-left: 3px solid var(--primary);
    padding-left: 8px;
    margin-bottom: 12px;
}

.preview-button {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    color: #4facfe;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
    width: 100%;
    margin-top: 8px;
    border: 1px solid rgba(255,255,255,0.2);
}

.modal-actions {
    display: flex;
    gap: 12px;
}

.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(0, 0, 0, 0.9);
    padding: 16px 32px;
    border-radius: 50px;
    z-index: 2000;
    transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app-main" style="max-width: 600px; margin: 0 auto;">
    <h1 class="title">📡 Broadcast Panel</h1>

    <div class="glass-card" id="compose-panel">
        <div class="section-title">NEW MESSAGE</div>
        <textarea id="message-text" placeholder="Enter Broadcast Text Message"></textarea>
        
        <div class="media-selectors">
            <div class="upload-card" onclick="document.getElementById('photo-input').click()">
                <input type="file" id="photo-input" accept="image/*" multiple style="display:none;" onchange="handleFileSelection(this, 'photo')">
                <i class="fas fa-images"></i>
                <span>Select Photos</span>
                <div id="photo-status" class="selection-status"></div>
            </div>
            <div class="upload-card" onclick="document.getElementById('video-input').click()">
                <input type="file" id="video-input" accept="video/*" multiple style="display:none;" onchange="handleFileSelection(this, 'video')">
                <i class="fas fa-film"></i>
                <span>Select Videos</span>
                <div id="video-status" class="selection-status"></div>
            </div>
        </div>

        <div id="caption-area" style="display:none;">
            <div class="section-title">CAPTION FIELD</div>
            <input type="text" id="caption-text" class="custom-input" placeholder="Caption For Photos/Videos">
        </div>

        <div class="section-title">INLINE BUTTON (OPTIONAL)</div>
        <input type="text" id="btn-text" class="custom-input" placeholder="Inline Button Text (e.g., Click Here)">

        <div class="section-title" style="margin-top:4px;">BUTTON TYPE</div>
        <div style="display:flex;gap:12px;margin-bottom:16px;">
            <label style="flex:1;cursor:pointer;">
                <div id="type-normal-card" onclick="selectBtnType('normal')" style="background:rgba(37,99,235,0.25);border:2px solid #2563eb;border-radius:14px;padding:14px;text-align:center;transition:all 0.3s;">
                    <i class="fas fa-link" style="font-size:20px;color:#60a5fa;margin-bottom:6px;display:block;"></i>
                    <span style="font-size:13px;font-weight:600;">Normal Inline Button</span>
                </div>
            </label>
            <label style="flex:1;cursor:pointer;">
                <div id="type-qr-card" onclick="selectBtnType('qrcode')" style="background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px;text-align:center;transition:all 0.3s;">
                    <i class="fas fa-qrcode" style="font-size:20px;color:#9ca3af;margin-bottom:6px;display:block;"></i>
                    <span style="font-size:13px;font-weight:600;">QR Code System</span>
                </div>
            </label>
        </div>

        <div id="url-field-wrap">
            <input type="text" id="btn-url" class="custom-input" placeholder="Inline Button URL (e.g., https://example.com)">
        </div>
        <div id="qr-info-wrap" style="display:none;background:rgba(37,99,235,0.1);border:1px solid rgba(37,99,235,0.3);border-radius:14px;padding:14px;margin-bottom:16px;font-size:13px;color:#93c5fd;">
            <i class="fas fa-info-circle"></i> QR Code System: User clicks the button → old message deleted → QR code image + payment button sent automatically.
        </div>

        <button class="btn btn-primary" id="start-btn" onclick="showPreview()">
            <span>🚀 Start Broadcast</span>
        </button>
    </div>

    <div class="glass-card" id="status-panel" style="display:none; text-align: center;">
        <div class="section-title">LIVE BROADCAST STATUS</div>
        <div class="counter-card">
            <div class="spinner"></div>
            <span id="live-progress-text">👤 Sent to: <span id="sent-count">0</span> users</span>
        </div>
        <div style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">
            Target: <span id="total-count">0</span>
        </div>
        <button class="btn btn-danger-outline" onclick="stopBroadcast()">
            <span>🛑 Stop Broadcast</span>
        </button>
    </div>
</div>

<div class="modal-overlay" id="preview-modal">
    <div class="modal-content">
        <h2 style="margin-bottom: 16px; text-align: center;">Message Preview</h2>
        <div class="preview-box">
            <div class="preview-media" id="preview-media"></div>
            <div class="preview-caption" id="preview-caption"></div>
            <div class="preview-text" id="preview-text"></div>
            <div id="preview-btn-container"></div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-danger-outline" style="margin-top:0;" onclick="closePreview()">Cancel</button>
            <button class="btn btn-primary" onclick="confirmSend()">Confirm Send</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">
    <span id="toast-msg"></span>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.expand();
}

const API = 'broadcast_api.php';
let selectedPhotos = [];
let selectedVideos = [];
let abortController = null;
let selectedBtnType = 'normal';

function selectBtnType(type) {
    selectedBtnType = type;
    const normalCard = document.getElementById('type-normal-card');
    const qrCard = document.getElementById('type-qr-card');
    const urlWrap = document.getElementById('url-field-wrap');
    const qrInfo = document.getElementById('qr-info-wrap');

    if (type === 'qrcode') {
        normalCard.style.background = 'rgba(255,255,255,0.05)';
        normalCard.style.borderColor = 'rgba(255,255,255,0.1)';
        normalCard.querySelector('i').style.color = '#9ca3af';
        qrCard.style.background = 'rgba(37,99,235,0.25)';
        qrCard.style.borderColor = '#2563eb';
        qrCard.querySelector('i').style.color = '#60a5fa';
        urlWrap.style.display = 'none';
        qrInfo.style.display = 'block';
    } else {
        normalCard.style.background = 'rgba(37,99,235,0.25)';
        normalCard.style.borderColor = '#2563eb';
        normalCard.querySelector('i').style.color = '#60a5fa';
        qrCard.style.background = 'rgba(255,255,255,0.05)';
        qrCard.style.borderColor = 'rgba(255,255,255,0.1)';
        qrCard.querySelector('i').style.color = '#9ca3af';
        urlWrap.style.display = 'block';
        qrInfo.style.display = 'none';
    }
}

function handleFileSelection(input, type) {
    const files = input.files;
    if (!files || files.length === 0) return;

    if (type === 'photo') {
        selectedPhotos = Array.from(files);
        const statusEl = document.getElementById('photo-status');
        statusEl.textContent = `✅ ${files.length} Photos Selected`;
        statusEl.style.display = 'block';
    } else if (type === 'video') {
        selectedVideos = Array.from(files);
        const statusEl = document.getElementById('video-status');
        statusEl.textContent = `✅ ${files.length} Videos Selected`;
        statusEl.style.display = 'block';
    }

    if (selectedPhotos.length > 0 || selectedVideos.length > 0) {
        document.getElementById('caption-area').style.display = 'block';
    } else {
        document.getElementById('caption-area').style.display = 'none';
    }
}

function showPreview() {
    const text = document.getElementById('message-text').value.trim();
    const caption = document.getElementById('caption-text').value.trim();
    const btnText = document.getElementById('btn-text').value.trim();
    const btnUrl = selectedBtnType === 'qrcode' ? '' : document.getElementById('btn-url').value.trim();
    
    if (!text && selectedPhotos.length === 0 && selectedVideos.length === 0 && !btnText) {
        showToast('Enter message or select files!');
        return;
    }

    const mediaContainer = document.getElementById('preview-media');
    mediaContainer.innerHTML = '';
    
    selectedPhotos.forEach(file => {
        const img = document.createElement('img');
        img.className = 'preview-thumb';
        img.src = URL.createObjectURL(file);
        mediaContainer.appendChild(img);
    });
    selectedVideos.forEach(file => {
        const video = document.createElement('video');
        video.className = 'preview-thumb';
        video.src = URL.createObjectURL(file);
        mediaContainer.appendChild(video);
    });

    document.getElementById('preview-text').textContent = text;
    document.getElementById('preview-caption').textContent = caption ? caption : '';
    document.getElementById('preview-caption').style.display = caption ? 'block' : 'none';

    const btnContainer = document.getElementById('preview-btn-container');
    btnContainer.innerHTML = '';
    if (btnText) {
        const btn = document.createElement('div');
        btn.className = 'preview-button';
        btn.textContent = selectedBtnType === 'qrcode' ? '🔲 ' + btnText + ' (QR Code)' : btnText;
        btnContainer.appendChild(btn);
    }

    document.getElementById('preview-modal').style.display = 'flex';
}

function closePreview() {
    document.getElementById('preview-modal').style.display = 'none';
}

async function confirmSend() {
    closePreview();
    
    const text = document.getElementById('message-text').value;
    const caption = document.getElementById('caption-text').value;
    const btnText = document.getElementById('btn-text').value;
    const btnUrl = selectedBtnType === 'qrcode' ? '' : document.getElementById('btn-url').value;
    
    const fd = new FormData();
    fd.append("text", text);
    fd.append("caption", caption);
    fd.append("btn_text", btnText);
    fd.append("btn_url", btnUrl);
    
    // Add media files to FormData
    selectedPhotos.forEach((file) => {
        fd.append("photo", file);
    });
    selectedVideos.forEach((file) => {
        fd.append("video", file);
    });

    fd.append("type", selectedBtnType === 'qrcode' ? 'qrcode' : 'normal');
    if (selectedBtnType === 'qrcode') {
        fd.append("qr_enabled", "1");
    }
    
    document.getElementById('compose-panel').style.display = 'none';
    document.getElementById('status-panel').style.display = 'block';
    document.getElementById('live-progress-text').innerHTML = `<i class="fas fa-check-circle" style="color:var(--primary)"></i> Broadcast Successfully Queued!`;
    document.getElementById('total-count').textContent = "7000+";

    try {
        const response = await fetch(API, {
            method: "POST",
            body: fd
        });
        const result = await response.text();
        if (result.includes("Broadcast Successfully")) {
            showToast('✅ Queued Successfully!');
        } else {
            showToast('❌ Error: ' + result);
        }
    } catch (e) {
        showToast('Error: ' + e.message);
    }
}

async function readStreamResponse(fd) { }

function stopBroadcast() {
    if (abortController) {
        abortController.abort();
    }
    document.getElementById('live-progress-text').innerHTML = `🛑 Broadcast Stopped`;
    showToast('Broadcast Stopped');
    setTimeout(() => window.location.reload(), 2000);
}

function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}
</script>

<script>
/* AUTO BACKGROUND BROADCAST WORKER */
setInterval(function(){

    fetch("broadcast_worker.php")
        .then(()=>{})
        .catch(()=>{});

},3000);
</script>
</body>
</html>
